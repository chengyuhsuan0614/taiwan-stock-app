<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台灣股市追蹤</title>
  <script src="api-config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f7; color: #1d1d1f; }

    .topbar {
      background: #1d1d1f; color: white;
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10;
    }
    .topbar h1 { font-size: 18px; font-weight: 600; }
    .live-badge {
      background: #30d158; color: #000;
      font-size: 11px; font-weight: 600;
      padding: 3px 10px; border-radius: 99px;
    }

    .tabs {
      background: white;
      border-bottom: 1px solid #e5e5e5;
      padding: 0 12px;
      display: flex; gap: 4px; overflow-x: auto;
      position: sticky; top: 46px; z-index: 9;
    }
    .tab {
      padding: 12px 16px; font-size: 14px;
      cursor: pointer; border-bottom: 2px solid transparent;
      color: #666; white-space: nowrap; transition: all .2s;
    }
    .tab.active { color: #0071e3; border-bottom-color: #0071e3; font-weight: 600; }
    .add-tab {
      padding: 12px 14px; font-size: 18px;
      cursor: pointer; color: #666;
    }

    .content { padding: 16px; max-width: 900px; margin: 0 auto; }

    .search-bar {
      display: flex; gap: 10px; margin-bottom: 16px;
    }
    .search-bar input {
      flex: 1; min-width: 0;
      padding: 12px 14px; border-radius: 10px;
      border: 1px solid #e5e5e5; font-size: 16px;
      background: white; outline: none;
    }
    .search-bar button {
      padding: 12px 16px; background: #0071e3; color: white;
      border: none; border-radius: 10px; font-size: 14px;
      cursor: pointer; font-weight: 600; white-space: nowrap;
    }
    .search-bar button:hover { background: #0077ed; }

    .stock-list { display: flex; flex-direction: column; gap: 10px; }
    .stock-card {
      background: white; border-radius: 14px;
      padding: 14px 16px; cursor: pointer;
      border: 1.5px solid transparent;
      display: flex; align-items: center; gap: 14px;
      transition: all .15s;
    }
    .stock-card:hover { border-color: #0071e3; }
    .stock-card.selected { border-color: #0071e3; background: #f0f7ff; }
    .stock-code {
      width: 52px; font-size: 13px;
      font-weight: 700; color: #0071e3;
      flex: 0 0 auto;
    }
    .stock-name {
      flex: 1; min-width: 0;
      font-size: 14px; font-weight: 500;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .stock-price { text-align: right; flex: 0 0 auto; }
    .price-num { font-size: 18px; font-weight: 700; }
    .price-chg { font-size: 12px; margin-top: 2px; }
    .up { color: #1f9d45; }
    .down { color: #ff3b30; }

    .detail-panel {
      background: white; border-radius: 14px;
      padding: 18px; margin-top: 16px;
    }
    .detail-header {
      display: flex; justify-content: space-between;
      align-items: flex-start; gap: 12px; margin-bottom: 16px;
    }
    .detail-name { font-size: 18px; font-weight: 700; }
    .detail-code { font-size: 13px; color: #777; margin-top: 2px; }
    .detail-price { font-size: 30px; font-weight: 800; white-space: nowrap; }
    .detail-chg { font-size: 14px; margin-top: 4px; }

    .period-btns { display: flex; gap: 6px; margin-bottom: 14px; }
    .period-btn {
      padding: 6px 14px; border-radius: 8px; font-size: 13px;
      cursor: pointer; border: 1px solid #e5e5e5;
      background: white; color: #666; transition: all .15s;
    }
    .period-btn.active { background: #0071e3; color: white; border-color: #0071e3; }

    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-top: 16px; }
    .stat { background: #f5f5f7; border-radius: 10px; padding: 10px 12px; }
    .stat-label { font-size: 11px; color: #777; }
    .stat-value { font-size: 15px; font-weight: 700; margin-top: 3px; }

    .loading, .empty, .error {
      text-align: center; padding: 36px 16px; color: #777; font-size: 14px;
      background: white; border-radius: 14px;
    }
    .error { color: #b42318; }

    @media (max-width: 520px) {
      .content { padding: 12px; }
      .topbar { padding: 13px 14px; }
      .tabs { top: 45px; }
      .search-bar { gap: 8px; }
      .search-bar button { padding: 12px 12px; }
      .stock-card { padding: 13px 12px; gap: 10px; }
      .detail-header { flex-direction: column; }
      .detail-price { font-size: 28px; }
      .stats { grid-template-columns: repeat(2,1fr); }
    }
  </style>
</head>
<body>

<div class="topbar">
  <h1>台灣股市追蹤</h1>
  <span class="live-badge">LIVE</span>
</div>

<div class="tabs" id="tabs"></div>

<div class="content">
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="輸入股票代號，例如：2330" />
    <button onclick="addStock()">新增追蹤</button>
  </div>
  <div class="stock-list" id="stock-list">
    <div class="loading">載入中...</div>
  </div>
  <div class="detail-panel" id="detail-panel" style="display:none"></div>
</div>

<script>
  const DEFAULT_TAB_NAMES = ["半導體", "金融股", "電動車"];
  const DEFAULT_TAB_STOCKS = [
    ["2330", "2303", "2454"],
    ["2882", "2881", "2886"],
    ["2049", "3680", "6669"],
  ];

  const LOCAL_API_BASE = `http://${window.location.hostname || "192.168.0.2"}:8000`;
  const API_BASE = window.STOCK_API_BASE || LOCAL_API_BASE;

  let tabNames = JSON.parse(localStorage.getItem("tabNames")) || DEFAULT_TAB_NAMES;
  let tabStocks = JSON.parse(localStorage.getItem("tabStocks")) || DEFAULT_TAB_STOCKS;
  let activeTab = Number(localStorage.getItem("activeTab")) || 0;
  let selectedCode = null;
  let detailChart = null;

  function saveState() {
    localStorage.setItem("tabNames", JSON.stringify(tabNames));
    localStorage.setItem("tabStocks", JSON.stringify(tabStocks));
    localStorage.setItem("activeTab", String(activeTab));
  }

  function renderTabs() {
    const tabsEl = document.getElementById("tabs");
    tabsEl.innerHTML = "";

    tabNames.forEach((name, idx) => {
      const tab = document.createElement("div");
      tab.className = "tab" + (idx === activeTab ? " active" : "");
      tab.textContent = name;
      tab.onclick = () => switchTab(idx);
      tabsEl.appendChild(tab);
    });

    const addBtn = document.createElement("div");
    addBtn.className = "add-tab";
    addBtn.textContent = "+";
    addBtn.onclick = addTab;
    tabsEl.appendChild(addBtn);
  }

  function switchTab(idx) {
    activeTab = idx;
    selectedCode = null;
    saveState();
    renderTabs();
    document.getElementById("detail-panel").style.display = "none";
    loadStockList();
  }

  async function loadStockList() {
    const listEl = document.getElementById("stock-list");
    const codes = tabStocks[activeTab] || [];

    if (codes.length === 0) {
      listEl.innerHTML = '<div class="empty">這個分頁還沒有股票，請先新增一支股票代號。</div>';
      return;
    }

    listEl.innerHTML = '<div class="loading">查詢中...</div>';

    try {
      const res = await fetch(`${API_BASE}/watchlist/${codes.join(",")}`);
      const data = await res.json();

      listEl.innerHTML = "";
      data.stocks.forEach(s => {
        const isUp = Number(s.change) >= 0;
        const chgStr = (isUp ? "▲ +" : "▼ ") + s.change + " (" + s.change_pct + "%)";
        const card = document.createElement("div");
        card.className = "stock-card" + (s.code === selectedCode ? " selected" : "");
        card.innerHTML = `
          <div class="stock-code">${s.code}</div>
          <div class="stock-name">${shortName(s.name)}</div>
          <div class="stock-price">
            <div class="price-num">NT$${Number(s.price || 0).toLocaleString()}</div>
            <div class="price-chg ${isUp ? "up" : "down"}">${chgStr}</div>
          </div>`;
        card.onclick = () => loadDetail(s.code, card);
        listEl.appendChild(card);
      });
    } catch (err) {
      listEl.innerHTML = `<div class="error">連不到後端 API，請確認 Python 伺服器有啟動：${API_BASE}</div>`;
    }
  }

  async function loadDetail(code, cardEl) {
    selectedCode = code;
    document.querySelectorAll(".stock-card").forEach(c => c.classList.remove("selected"));
    if (cardEl) cardEl.classList.add("selected");

    const panel = document.getElementById("detail-panel");
    panel.style.display = "block";
    panel.innerHTML = '<div class="loading">載入圖表中...</div>';

    try {
      const res = await fetch(`${API_BASE}/stock/${code}`);
      const s = await res.json();

      const price = Number(s.price || 0);
      const prevClose = Number(s.prev_close || 0);
      const change = price - prevClose;
      const changePct = prevClose ? (change / prevClose * 100) : 0;
      const isUp = change >= 0;
      const chgStr = (isUp ? "▲ +" : "▼ ") + change.toFixed(2) + " (" + changePct.toFixed(2) + "%)";

      panel.innerHTML = `
        <div class="detail-header">
          <div>
            <div class="detail-name">${s.name}</div>
            <div class="detail-code">${s.code} · 台灣證交所</div>
          </div>
          <div style="text-align:right">
            <div class="detail-price">NT$${price.toLocaleString()}</div>
            <div class="detail-chg ${isUp ? "up" : "down"}">${chgStr}</div>
          </div>
        </div>
        <div class="period-btns">
          <button class="period-btn active">5日</button>
          <button class="period-btn">1月</button>
          <button class="period-btn">3月</button>
        </div>
        <canvas id="stockChart" height="180"></canvas>
        <div class="stats">
          <div class="stat"><div class="stat-label">開盤</div><div class="stat-value">NT$${s.open}</div></div>
          <div class="stat"><div class="stat-label">最高</div><div class="stat-value up">NT$${s.high}</div></div>
          <div class="stat"><div class="stat-label">最低</div><div class="stat-value down">NT$${s.low}</div></div>
          <div class="stat"><div class="stat-label">昨收</div><div class="stat-value">NT$${s.prev_close}</div></div>
          <div class="stat"><div class="stat-label">本益比</div><div class="stat-value">${Number(s.pe_ratio || 0).toFixed(1)}</div></div>
          <div class="stat"><div class="stat-label">成交量</div><div class="stat-value">${(Number(s.volume || 0) / 1000000).toFixed(1)}M</div></div>
        </div>`;

      drawChart(s.history || [], isUp);
      panel.scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (err) {
      panel.innerHTML = `<div class="error">載入 ${code} 失敗，請確認後端 API 有啟動。</div>`;
    }
  }

  function drawChart(history, isUp) {
    if (detailChart) {
      detailChart.destroy();
      detailChart = null;
    }

    const ctx = document.getElementById("stockChart").getContext("2d");
    detailChart = new Chart(ctx, {
      type: "line",
      data: {
        labels: history.map(h => h.date),
        datasets: [{
          label: "收盤價",
          data: history.map(h => h.close),
          borderColor: isUp ? "#1f9d45" : "#ff3b30",
          backgroundColor: isUp ? "rgba(31,157,69,0.10)" : "rgba(255,59,48,0.10)",
          fill: true,
          tension: 0.3,
          pointRadius: 4,
          borderWidth: 2,
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 11 } } },
          y: { ticks: { callback: v => "NT$" + Number(v).toLocaleString(), font: { size: 11 } } }
        }
      }
    });
  }

  function addStock() {
    const input = document.getElementById("search-input");
    const code = input.value.trim();

    if (!code) return alert("請輸入股票代號！");
    if (!/^[0-9]{4,6}$/.test(code)) return alert("請輸入正確股票代號，例如 2330");
    if (tabStocks[activeTab].includes(code)) return alert("這支股票已在清單中！");

    tabStocks[activeTab].push(code);
    saveState();
    input.value = "";
    loadStockList();
  }

  function addTab() {
    const name = prompt("請輸入新分頁名稱，例如：航運股");
    if (!name) return;

    tabNames.push(name.trim());
    tabStocks.push([]);
    activeTab = tabNames.length - 1;
    saveState();
    renderTabs();
    loadStockList();
  }

  function shortName(name) {
    return String(name || "查無資料")
      .replace("Taiwan", "")
      .replace("Corporation", "")
      .replace("Company Limited", "")
      .replace("Inc.", "")
      .trim();
  }

  document.getElementById("search-input").addEventListener("keydown", event => {
    if (event.key === "Enter") addStock();
  });

  renderTabs();
  loadStockList();
  setInterval(loadStockList, 60000);
</script>
</body>
</html>
